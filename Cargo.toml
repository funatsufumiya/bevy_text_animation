[package]
name = "bevy_text_animation"
version = "0.7.0"
edition = "2021"
repository = "https://github.com/funatsufumiya/bevy_text_animation"
description = "text animation library for Bevy"
license = "WTFPL OR 0BSD"
# autoexamples = false

[features]
default = []

[dev-dependencies]
bevy = { version = "0.19" }

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_text",
    "bevy_sprite",
    "bevy_ui",
] }
utf8_slice = "1.0.0"
